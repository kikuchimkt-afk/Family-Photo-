<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家族写真アルバム</title>
    <meta name="description" content="Googleドライブで家族の写真を整理・共有するアプリ">
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <meta name="theme-color" content="#0f0f14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app">
        <!-- Login Screen -->
        <div class="login-screen" id="loginScreen">
            <div class="login-card">
                <div class="login-icon">
                    <img src="icon.png" alt="Logo"
                        style="width: 80px; height: 80px; border-radius: 20%; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
                </div>
                <h1>家族写真アルバム</h1>
                <p>Googleドライブで写真を整理・共有</p>
                <button id="loginBtn" class="btn btn-google">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.04-3.71 1.04-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    Googleでログイン
                </button>
                <p class="login-note">※ Googleドライブへのアクセス許可が必要です</p>
            </div>
        </div>

        <!-- Main App -->
        <div class="main-app" id="mainApp" style="display: none;">
            <!-- Header -->
            <header class="header">
                <h1 class="logo">
                    <img src="icon.png" alt="Logo"
                        style="width: 32px; height: 32px; border-radius: 8px; vertical-align: middle; margin-right: 8px;">
                    家族写真アルバム
                </h1>
                <div class="header-actions">
                    <button id="installBtn" class="btn btn-primary btn-sm" style="display: none;">
                        <span class="icon">📲</span> アプリをインストール
                    </button>
                    <div class="user-info" id="userInfo">
                        <img class="user-avatar" id="userAvatar" src="" alt="">
                        <span id="userName"></span>
                    </div>
                    <button id="logoutBtn" class="btn btn-secondary btn-sm">ログアウト</button>
                </div>
            </header>

            <!-- Toolbar -->
            <div class="toolbar" id="toolbar">
                <div class="toolbar-left">
                    <button class="btn btn-primary" id="uploadBtn">
                        <span class="icon">📤</span> ファイル
                    </button>
                    <button class="btn btn-primary" id="uploadFolderBtn">
                        <span class="icon">📂</span> フォルダ
                    </button>
                    <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
                    <input type="file" id="folderInput" webkitdirectory directory multiple style="display: none;">
                    <button class="btn btn-secondary" id="newFolderBtn">
                        <span class="icon">🏷️</span> 新規タグ
                    </button>
                </div>
                <div class="toolbar-center">
                    <div class="selection-info">
                        全 <span id="totalCount">0</span> 枚 / <span id="selectionCount">0</span> 枚選択中
                    </div>
                </div>
                <div class="toolbar-right">
                    <button class="btn btn-icon" id="selectAllBtn" title="全選択">☑️</button>
                    <button class="btn btn-icon" id="deselectAllBtn" title="選択解除">⬜</button>
                    <div class="toolbar-divider"></div>
                    <button class="btn btn-action" id="downloadBtn" disabled>
                        <span class="icon">📥</span> ダウンロード
                    </button>
                    <button class="btn btn-action" id="moveBtn" disabled>
                        <span class="icon">🏷️</span> タグ追加
                    </button>
                    <button class="btn btn-action" id="removeTagBtn" disabled>
                        <span class="icon">❌</span> タグ削除
                    </button>
                    <button class="btn btn-action" id="renameBtn" disabled>
                        <span class="icon">✏️</span> リネーム
                    </button>
                    <button class="btn btn-danger" id="deleteBtn" disabled>
                        <span class="icon">🗑️</span> 削除
                    </button>
                </div>
            </div>

            <!-- Folder Navigation -->
            <div class="folder-nav" id="folderNav">
                <div class="breadcrumb" id="breadcrumb">
                    <span class="breadcrumb-item active" data-id="root">🏠 ルート</span>
                </div>
            </div>

            <!-- Main Content -->
            <main class="main-content" id="mainContent">
                <!-- Drop Zone -->
                <div class="drop-zone" id="dropZone">
                    <div class="drop-zone-content">
                        <span class="drop-icon">📤</span>
                        <p>ここにファイルをドロップしてアップロード</p>
                    </div>
                </div>

                <div class="empty-state" id="emptyState" style="display: none;">
                    <div class="empty-icon">📷</div>
                    <h2>写真がありません</h2>
                    <p>「ファイル」または「フォルダ」ボタンで写真を追加してください</p>
                </div>

                <div class="photo-gallery" id="photoGallery"></div>
            </main>
        </div>

        <!-- Move Modal -->
        <div class="modal" id="moveModal">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h2>タグを追加</h2>
                    <button class="modal-close" id="closeMoveModal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="folder-list" id="folderList"></div>
                    <div class="form-group">
                        <button class="btn btn-secondary btn-block" id="createFolderInModal">
                            <span class="icon">➕</span> 新規タグを作成
                        </button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="cancelMoveBtn">キャンセル</button>
                    <button class="btn btn-primary" id="confirmMoveBtn">追加</button>
                </div>
            </div>
        </div>

        <!-- Rename Modal -->
        <div class="modal" id="renameModal">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h2>一括リネーム</h2>
                    <button class="modal-close" id="closeRenameModal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="renamePrefix">ファイル名プレフィックス</label>
                        <input type="text" id="renamePrefix" placeholder="例: 2025年沖縄旅行" class="input">
                    </div>
                    <div class="form-group">
                        <label for="startNumber">開始番号</label>
                        <input type="number" id="startNumber" value="1" min="1" class="input">
                    </div>
                    <div class="form-group">
                        <label for="digitCount">桁数</label>
                        <select id="digitCount" class="input">
                            <option value="2">2桁 (01, 02...)</option>
                            <option value="3" selected>3桁 (001, 002...)</option>
                            <option value="4">4桁 (0001, 0002...)</option>
                        </select>
                    </div>
                    <div class="preview-box">
                        <h4>プレビュー</h4>
                        <div id="renamePreview" class="preview-list"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="cancelRenameBtn">キャンセル</button>
                    <button class="btn btn-primary" id="confirmRenameBtn">リネーム実行</button>
                </div>
            </div>
        </div>

        <!-- New Folder Modal -->
        <div class="modal" id="newFolderModal">
            <div class="modal-overlay"></div>
            <div class="modal-content modal-small">
                <div class="modal-header">
                    <h2>新規フォルダ</h2>
                    <button class="modal-close" id="closeNewFolderModal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="newFolderName">フォルダ名</label>
                        <input type="text" id="newFolderName" placeholder="例: 2025年1月" class="input">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="cancelNewFolderBtn">キャンセル</button>
                    <button class="btn btn-primary" id="confirmNewFolderBtn">作成</button>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">読み込み中...</div>
        </div>

        <!-- Upload Progress -->
        <div class="upload-progress" id="uploadProgress">
            <div class="upload-progress-header">
                <span>アップロード中...</span>
                <span id="uploadProgressText">0/0</span>
            </div>
            <div class="upload-progress-bar">
                <div class="upload-progress-fill" id="uploadProgressFill"></div>
            </div>
        </div>

        <!-- Photo Viewer Modal -->
        <div class="modal viewer-modal" id="viewerModal">
            <div class="modal-overlay"></div>
            <div class="viewer-content">
                <button class="viewer-close" id="closeViewerBtn">&times;</button>
                <div class="viewer-image-container">
                    <img src="" alt="" id="viewerImage">
                </div>
                <div class="viewer-info">
                    <h3 id="viewerFileName"></h3>
                    <p id="viewerDate"></p>
                    <div id="viewerTags" class="viewer-tags"></div>
                </div>
                <button class="viewer-nav viewer-prev" id="viewerPrevBtn">‹</button>
                <button class="viewer-nav viewer-next" id="viewerNextBtn">›</button>
            </div>
        </div>
    </div>

    <!-- Google API -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
